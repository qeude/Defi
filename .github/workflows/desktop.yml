name: Desktop

# Desktop tests on a hosted macOS runner, with Defi-owned fixture windows only. Hosted runners
# allow sudo writes to the system TCC database, so the test processes get Accessibility and
# Screen Recording, which the desktop preflight requires, before the tests start.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build tests and fixtures
        run: ./script/test_desktop.sh --build-tests

      - name: Grant Accessibility and Screen Recording to the test processes
        run: |
          developer="$(xcode-select -p)"
          clients=(
            /bin/bash
            "$developer/usr/bin/xctest"
            "$developer/Toolchains/XcodeDefault.xctoolchain/usr/libexec/swift/pm/swiftpm-testing-helper"
            "$PWD/.build/desktop-fixtures/DefiDesktopFocusFixture"
          )
          for client in "${clients[@]}"; do
            [ -e "$client" ] || { echo "::warning::missing $client"; continue; }
            for service in kTCCServiceAccessibility kTCCServiceScreenCapture; do
              sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
                "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) VALUES('$service','$client',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$(date +%s));"
            done
          done
          sudo launchctl stop com.apple.tccd 2>/dev/null || true
          sleep 2

      - name: Turn Reduce Motion off
        # Hosted runners enable it; the desktop preflight needs animations on.
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.Accessibility ReduceMotionEnabled -bool false
          killall cfprefsd 2>/dev/null || true
          echo "reduceMotion=$(defaults read com.apple.universalaccess reduceMotion 2>&1)"

      - name: Desktop tests
        env:
          # Hosted runners launch the fixture apps slowly; this budget covers setup only.
          DEFI_E2E_FIXTURE_DISCOVERY_SECONDS: "10"
          DEFI_AX_TRACE_OUT: ${{ runner.temp }}/ax-trace.json
        run: |
          set -o pipefail
          ./script/test_desktop.sh 2>&1 | tee desktop.log

      - name: Compare the simulated macOS with the real trace
        run: DEFI_ISOLATED=1 DEFI_AX_TRACE_IN="$RUNNER_TEMP/ax-trace.json" swift test --skip-build --filter FidelityTraceTests

      - name: Keep the real focus trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-trace
          path: ${{ runner.temp }}/ax-trace.json
          if-no-files-found: warn

      - name: Report Accessibility availability
        if: always()
        run: |
          grep -o "DEFI_E2E accessibility=[a-z]* screen-recording=[a-z]*" desktop.log | head -1
          if ! grep -q "DEFI_E2E accessibility=available screen-recording=available" desktop.log; then
            echo "::error::Accessibility or Screen Recording was not available; the desktop tests did not run for real."
            exit 1
          fi
