name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: SwiftPM
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Module boundaries
        # AGENTS.md: pure modules stay off platform frameworks, and private macOS APIs stay in DefiMacOS.
        run: |
          if grep -rnE '^[[:space:]]*(@[A-Za-z_]+[[:space:]]+)*import[[:space:]]+((struct|class|enum|protocol|typealias|func|var|let)[[:space:]]+)?(AppKit|ApplicationServices|CoreGraphics|Cocoa|Carbon|CoreServices|QuartzCore|ScreenCaptureKit)\b' \
            Sources/DefiModel Sources/DefiCore Sources/DefiConfig Sources/DefiRuntime Sources/DefiIPC; then
            echo "::error::Pure modules must not import AppKit, ApplicationServices, CoreGraphics, or other platform frameworks."
            exit 1
          fi
          if grep -rnE '\b(dlsym|dlopen)\b|@_silgen_name|SkyLight' Sources --exclude-dir=DefiMacOS; then
            echo "::error::Private macOS API use must stay inside DefiMacOS."
            exit 1
          fi

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Deterministic tests
        # DesktopE2ETests require a real interactive session and Accessibility permission.
        run: swift test --skip DesktopE2ETests

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Release automation checks
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          bash Tests/Release/test_homebrew_release.sh
          bash Tests/Release/test_install_script.sh
          bash Tests/Verification/test_verification.sh
          python3 -m unittest discover -s Tests/Verification -p 'test_*.py'
