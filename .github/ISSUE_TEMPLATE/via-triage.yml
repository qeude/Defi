name: Triage report
description: Filed with `defi triage`, where a coding agent investigated the machine. For hand-written reports use the bug report template instead.
labels:
  - via-triage
body:
  - type: markdown
    attributes:
      value: |
        This structure is what `defi triage` agents follow. Keep one problem per issue
        and redact private names, window titles, and home directory paths from anything
        you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the user's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in status, logs, and source.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic repro if one was found.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Version the bug happened on (not the `defi triage` CLI version), or unknown.
      placeholder: 0.6.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model, monitors and arrangement, install method, and other window managers or key remappers running.
      placeholder: macOS 26.0, MacBook Pro M3, two external 4K displays, Homebrew, Karabiner-Elements
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The most relevant status, trace, log, or config lines only. Redacted.
      render: shell

  - type: input
    id: related
    attributes:
      label: Related issues
      description: Existing issues that look similar, and why this is not a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was run on the machine to unblock the user.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: Which agent and model produced this report.
      placeholder: claude (opus-5) via defi triage
